name: Build and publish direct APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Publish directly downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk REA-APK-Backup.apk
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 REA-APK-Backup.apk --clobber
          else
            gh release create v1.0.0 REA-APK-Backup.apk --title "REA APK Backup v1.0.0" --notes "Personal testing build. Back up installed base and split APK files to .apks. Does not include app data or license."
          fi
